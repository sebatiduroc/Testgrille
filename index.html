<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c8a96e">
<title>Mots-Lierre — Grilles records</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24;
    --border:#2a2a35; --gold:#c8a96e; --gold-light:#e8c98e;
    --cream:#f0e8d8; --text:#d8d0c8; --text-dim:#8a8578;
    --tile-bg:#1a1a22; --tile-border:#30304a; --recon:#7a9ec4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  header {
    max-width: 720px; margin: 0 auto 24px; text-align: center;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  #status {
    font-size: 0.7rem; letter-spacing: 0.12em; color: var(--text-dim);
    text-transform: uppercase; line-height: 1.8;
  }
  #status strong { color: var(--gold); }
  #controls {
    display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  #reconStatus {
    font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 8px;
  }
  #reconStatus strong { color: var(--recon); }
  button {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--gold); background: transparent; color: var(--gold);
    transition: all .15s;
  }
  button.recon-btn { border-color: var(--recon); color: var(--recon); }
  button.recon-btn:hover { background: rgba(122,158,196,0.1); }
  button:hover { background: rgba(200,169,110,0.1); }
  button:disabled { opacity: 0.4; cursor: default; }

  #feed {
    max-width: 720px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    animation: fadeIn .4s ease-out;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

  .card-head {
    text-align: center;
  }
  .card-badge {
    display: inline-block; font-size: 0.6rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: #0d0d0f; background: var(--gold);
    border-radius: 6px; padding: 3px 10px; font-weight: 500; margin-bottom: 6px;
  }
  .card.first .card-badge { background: var(--cream); }
  .card.recon .card-badge { background: var(--recon); }
  .card.recon .path-svg path { stroke: var(--recon); filter: drop-shadow(0 0 4px rgba(122,158,196,.6)); }
  .card.recon .tile.in-path { border-color: var(--recon); color: #cfe0f0; }
  .card.recon .tile .order-badge { color: var(--recon); }
  .card.recon .word-display { color: #cfe0f0; }
  .card-sub {
    font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  .grid-wrap { position: relative; width: 278px; height: 278px; }
  .grid {
    display: grid; grid-template-columns: repeat(4, 62px); grid-template-rows: repeat(4, 62px);
    gap: 6px;
  }
  .path-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .path-svg path {
    fill: none; stroke: var(--gold); stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round; opacity: .75;
    filter: drop-shadow(0 0 4px rgba(200,169,110,.6));
  }
  .tile {
    width: 62px; height: 62px;
    background: var(--tile-bg); border: 1.5px solid var(--tile-border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700;
    color: var(--cream);
    position: relative;
  }
  .tile.in-path {
    background: #201c30; border-color: var(--gold); color: var(--gold-light);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .tile .order-badge {
    position: absolute; top: 2px; left: 3px;
    font-family: 'DM Mono', monospace; font-size: 0.55rem; font-weight: 500;
    color: var(--gold);
  }
  .word-display {
    font-family: 'Playfair Display', serif; font-size: 1rem;
    color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase;
  }

  table.len-table {
    border-collapse: collapse; font-size: 0.72rem; width: 100%; max-width: 380px;
  }
  table.len-table th, table.len-table td {
    border: 1px solid var(--border); padding: 6px 4px; text-align: center;
  }
  table.len-table th {
    color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.6rem;
    background: var(--surface2);
  }
  table.len-table td.len-longest { color: var(--gold-light); font-weight: 500; }
  table.len-table td.total-cell { color: var(--gold); font-weight: 500; }

  #loadingScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px; z-index: 100;
  }
  #loadingScreen h2 {
    font-family: 'Playfair Display', serif; font-size: 1.8rem;
    color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase;
  }
  #loadingMsg { font-size: 0.68rem; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
  .bar-wrap { width: min(80vw, 300px); height: 4px; background: var(--surface2); border-radius: 2px; overflow:hidden; }
  #progressBar { height: 100%; width: 0%; background: var(--gold); transition: width .2s; }
  #errorMsg { font-size: 0.7rem; color: #e05252; text-align: center; max-width: 320px; display:none; }
</style>
</head>
<body>

<div id="loadingScreen">
  <h2>Mots-Lierre</h2>
  <div id="loadingMsg">Chargement du dictionnaire…</div>
  <div class="bar-wrap"><div id="progressBar"></div></div>
  <div id="errorMsg"></div>
</div>

<header>
  <h1>Grilles records</h1>
  <div id="status">Préparation…</div>
  <div id="controls">
    <button id="btnStartRecords" disabled>Rechercher des grilles records</button>
    <button id="btnReconstruct" class="recon-btn" disabled>Générer 10 grilles (mot de 16 lettres)</button>
    <button id="btnPause" style="display:none;">Pause</button>
  </div>
  <div id="reconStatus"></div>
</header>

<div id="feed"></div>

<script>
// ══════════════════════════════════════════════════════════
// DICTIONNAIRE
// ══════════════════════════════════════════════════════════
const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();

function setMsg(t){ document.getElementById('loadingMsg').textContent = t; }
function setBar(p){ document.getElementById('progressBar').style.width = p+'%'; }
function showError(msg){
  const e = document.getElementById('errorMsg');
  e.textContent = msg; e.style.display = 'block';
  setMsg('Erreur de chargement');
}

async function loadDictionary() {
  setMsg('Chargement du dictionnaire…'); setBar(5);
  let text;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    const resp = await fetch('ODS.txt', { signal: controller.signal });
    clearTimeout(timeout);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ODS.txt introuvable. Placez ce fichier à côté de cette page.`);
    setBar(30);
    text = await resp.text();
    setBar(60);
  } catch(e) {
    if (e.name === 'AbortError') showError('Délai dépassé — ODS.txt trop long à charger.');
    else showError(e.message);
    return;
  }

  setMsg('Analyse des mots…'); setBar(62);
  const dictionary = new Set();
  const lines = text.replace(/\r/g,'').split('\n');
  let n=0;
  for (let i=0; i<lines.length; i++) {
    const w = lines[i].trim(); if (!w) continue;
    if (w.length>=3 && w.length<=16) dictionary.add(normalize(w));
    n++;
    if (n%50000===0) { setBar(62+Math.min(33,(n/lines.length*33)|0)); await new Promise(r=>setTimeout(r,0)); }
  }
  setBar(100);
  setMsg(`${dictionary.size.toLocaleString('fr-FR')} mots chargés ✓`);
  const words16 = [...dictionary].filter(w => w.length === 16);
  await new Promise(r=>setTimeout(r,500));
  document.getElementById('loadingScreen').style.display = 'none';
  startEngine(dictionary, words16);
}

// ══════════════════════════════════════════════════════════
// WORKER — trie + génération/analyse de grilles en tâche de fond
// ══════════════════════════════════════════════════════════
function startEngine(dictionary, words16) {
  const workerCode = `
    function buildTrie(words) {
      const root = Object.create(null);
      for (const w of words) {
        let node = root;
        for (const ch of w) {
          if (!node[ch]) node[ch] = Object.create(null);
          node = node[ch];
        }
        node['$'] = true;
      }
      return root;
    }

    function analyzeBoard(board, trie) {
      const N = 4;
      const adj = [];
      for (let i = 0; i < 16; i++) {
        adj[i] = [];
        const r = Math.floor(i / N), c = i % N;
        for (let j = 0; j < 16; j++) {
          const dr = Math.abs(r - Math.floor(j/N)), dc = Math.abs(c - j%N);
          if (dr<=1 && dc<=1 && i!==j) adj[i].push(j);
        }
      }
      const found = new Set();
      function dfs(idx, path, node, word) {
        if (word.length >= 3 && node['$']) found.add(word);
        for (const nb of adj[idx]) {
          if (path.includes(nb)) continue;
          const ch = board[nb];
          if (!node[ch]) continue;
          path.push(nb);
          dfs(nb, path, node[ch], word + ch);
          path.pop();
        }
      }
      for (let i = 0; i < 16; i++) {
        const ch = board[i];
        if (!trie[ch]) continue;
        dfs(i, [i], trie[ch], ch);
      }
      return { words: [...found] };
    }

    // Trouve un chemin (suite d'indices de cases adjacentes) formant le mot "word" sur "board".
    function findPath(board, word) {
      const N = 4;
      const adj = [];
      for (let i = 0; i < 16; i++) {
        adj[i] = [];
        const r = Math.floor(i / N), c = i % N;
        for (let j = 0; j < 16; j++) {
          const dr = Math.abs(r - Math.floor(j/N)), dc = Math.abs(c - j%N);
          if (dr<=1 && dc<=1 && i!==j) adj[i].push(j);
        }
      }
      function dfs(idx, path, wi) {
        if (wi === word.length) return true;
        for (const nb of adj[idx]) {
          if (path.includes(nb)) continue;
          if (board[nb] !== word[wi]) continue;
          path.push(nb);
          if (dfs(nb, path, wi+1)) return true;
          path.pop();
        }
        return false;
      }
      for (let i = 0; i < 16; i++) {
        if (board[i] !== word[0]) continue;
        const path = [i];
        if (dfs(i, path, 1)) return path;
      }
      return null;
    }

    function buildAdjacency() {
      const N = 4;
      const adj = [];
      for (let i = 0; i < 16; i++) {
        adj[i] = [];
        const r = Math.floor(i / N), c = i % N;
        for (let j = 0; j < 16; j++) {
          const dr = Math.abs(r - Math.floor(j/N)), dc = Math.abs(c - j%N);
          if (dr<=1 && dc<=1 && i!==j) adj[i].push(j);
        }
      }
      return adj;
    }
    const ADJ = buildAdjacency();

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.random()*(i+1)|0;
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    // Cherche un chemin qui visite les 16 cases une seule fois (chemin hamiltonien),
    // via un parcours en profondeur avec ordre de voisins aléatoire et retour arrière.
    function randomHamiltonianPath() {
      for (let attempt = 0; attempt < 300; attempt++) {
        const visited = new Array(16).fill(false);
        const path = [];
        const start = Math.random()*16|0;
        path.push(start); visited[start] = true;
        let steps = 0;
        const STEP_CAP = 20000;
        let stepLimitHit = false;
        function dfs(node) {
          if (path.length === 16) return true;
          const neighbors = shuffle(ADJ[node].slice());
          for (const nb of neighbors) {
            if (visited[nb]) continue;
            steps++;
            if (steps > STEP_CAP) { stepLimitHit = true; return false; }
            visited[nb] = true; path.push(nb);
            if (dfs(nb)) return true;
            path.pop(); visited[nb] = false;
            if (stepLimitHit) return false;
          }
          return false;
        }
        if (dfs(start)) return path;
      }
      return null;
    }

    const FRENCH_DICE_W = [
      'AELMNU','AEHLOS','AINOTW','ABORTU','EILTUZ','AEIPSV','AEINRT',
      'EIORTY','ADEILS','ACEINO','ACELRS','EJLRST','EIPRSU','AEKOQS',
      'ACFNTX','CEGILR'
    ];
    function randomBoard() {
      const dice=[...FRENCH_DICE_W];
      for (let i=dice.length-1;i>0;i--) { const j=Math.random()*(i+1)|0; [dice[i],dice[j]]=[dice[j],dice[i]]; }
      return dice.map(d=>d[Math.random()*d.length|0]);
    }

    let trie = null;
    let words16 = [];
    let running = false;
    let record = -1;
    let tested = 0;

    function lengthCounts(words) {
      const counts = {};
      let maxLen = 0;
      for (const w of words) {
        counts[w.length] = (counts[w.length]||0) + 1;
        if (w.length > maxLen) maxLen = w.length;
      }
      return { counts, maxLen };
    }

    function loop() {
      if (!running) return;
      const BATCH = 60;
      for (let i = 0; i < BATCH; i++) {
        const board = randomBoard();
        const { words } = analyzeBoard(board, trie);
        tested++;
        const { counts, maxLen } = lengthCounts(words);
        if (record === -1) {
          // Phase 1 : première grille avec au moins 100 mots
          if (words.length >= 100) {
            record = maxLen;
            const longest = words.find(w => w.length === maxLen);
            const path = findPath(board, longest);
            self.postMessage({ type:'grid', board, counts, total: words.length, maxLen, tested, first:true, longest, path });
          }
        } else if (maxLen > record) {
          record = maxLen;
          const longest = words.find(w => w.length === maxLen);
          const path = findPath(board, longest);
          self.postMessage({ type:'grid', board, counts, total: words.length, maxLen, tested, first:false, longest, path });
        }
      }
      self.postMessage({ type:'progress', tested });
      setTimeout(loop, 0);
    }

    function reconstructBatch(count) {
      if (!words16.length) {
        self.postMessage({ type:'reconError', message:'Aucun mot de 16 lettres dans le dictionnaire.' });
        return;
      }
      for (let k = 0; k < count; k++) {
        const word = words16[Math.random()*words16.length|0];
        const path = randomHamiltonianPath();
        if (!path) continue;
        const board = new Array(16);
        for (let i = 0; i < 16; i++) board[path[i]] = word[i];
        const { words } = analyzeBoard(board, trie);
        const { counts, maxLen } = lengthCounts(words);
        self.postMessage({ type:'reconGrid', board, counts, total: words.length, maxLen, longest: word, path });
      }
    }

    self.onmessage = function(e) {
      if (e.data.type === 'build') {
        trie = buildTrie(e.data.words);
        words16 = e.data.words16 || [];
        self.postMessage({ type:'ready' });
      } else if (e.data.type === 'start') {
        running = true;
        loop();
      } else if (e.data.type === 'pause') {
        running = false;
      } else if (e.data.type === 'resume') {
        running = true;
        loop();
      } else if (e.data.type === 'reconstruct') {
        reconstructBatch(e.data.count || 10);
      }
    };
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([workerCode], {type:'application/javascript'})));

  const statusEl = document.getElementById('status');
  const feedEl = document.getElementById('feed');
  const btnPause = document.getElementById('btnPause');
  const btnStartRecords = document.getElementById('btnStartRecords');
  const btnReconstruct = document.getElementById('btnReconstruct');
  const reconStatusEl = document.getElementById('reconStatus');
  let running = false;
  let lastTested = 0;
  let reconCount = 0;

  worker.onmessage = (e) => {
    if (e.data.type === 'ready') {
      statusEl.textContent = 'Prêt — choisissez un mode ci-dessus.';
      btnStartRecords.disabled = false;
      btnReconstruct.disabled = false;
    } else if (e.data.type === 'progress') {
      lastTested = e.data.tested;
      updateStatus();
    } else if (e.data.type === 'grid') {
      lastTested = e.data.tested;
      addCard(e.data, e.data.first ? 'first' : 'record');
      updateStatus();
    } else if (e.data.type === 'reconGrid') {
      reconCount++;
      addCard(e.data, 'recon');
      reconStatusEl.innerHTML = `<strong>${reconCount}</strong> grilles rétroconstruites`;
    } else if (e.data.type === 'reconError') {
      reconStatusEl.textContent = e.data.message;
    }
  };

  function updateStatus() {
    statusEl.innerHTML = `<strong>${lastTested.toLocaleString('fr-FR')}</strong> grilles testées`;
  }

  btnStartRecords.addEventListener('click', () => {
    btnStartRecords.disabled = true;
    btnPause.style.display = 'inline-block';
    statusEl.textContent = 'Recherche de la première grille (≥ 100 mots)…';
    worker.postMessage({ type: 'start' });
    running = true;
  });

  btnPause.addEventListener('click', () => {
    running = !running;
    worker.postMessage({ type: running ? 'resume' : 'pause' });
    btnPause.textContent = running ? 'Pause' : 'Reprendre';
  });

  btnReconstruct.addEventListener('click', () => {
    worker.postMessage({ type: 'reconstruct', count: 10 });
  });

  function addCard(data, kind) {
    const card = document.createElement('div');
    card.className = 'card' + (kind === 'first' ? ' first' : '') + (kind === 'recon' ? ' recon' : '');

    const head = document.createElement('div');
    head.className = 'card-head';
    const badge = document.createElement('div');
    badge.className = 'card-badge';
    if (kind === 'first') badge.textContent = 'Première grille — 100+ mots';
    else if (kind === 'recon') badge.textContent = 'Rétroconstruction — mot de 16 lettres';
    else badge.textContent = `Nouveau record — mot de ${data.maxLen} lettres`;
    head.appendChild(badge);
    const sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = `${data.total} mots trouvables · plus long mot : ${data.maxLen} lettres`;
    head.appendChild(sub);
    card.appendChild(head);

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    const grid = document.createElement('div');
    grid.className = 'grid';
    const orderOf = new Map();
    if (data.path) data.path.forEach((idx, i) => orderOf.set(idx, i+1));
    data.board.forEach((letter, i) => {
      const t = document.createElement('div');
      t.className = 'tile' + (orderOf.has(i) ? ' in-path' : '');
      t.textContent = letter;
      if (orderOf.has(i)) {
        const badge = document.createElement('span');
        badge.className = 'order-badge';
        badge.textContent = orderOf.get(i);
        t.appendChild(badge);
      }
      grid.appendChild(t);
    });
    gridWrap.appendChild(grid);

    if (data.path && data.path.length >= 2) {
      const TILE = 62, GAP = 6;
      const centerOf = idx => {
        const r = Math.floor(idx / 4), c = idx % 4;
        return { x: c*(TILE+GAP) + TILE/2, y: r*(TILE+GAP) + TILE/2 };
      };
      const d = data.path.map((idx, k) => {
        const p = centerOf(idx);
        return `${k ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;
      }).join(' ');
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'path-svg');
      svg.setAttribute('viewBox', `0 0 278 278`);
      svg.innerHTML = `<path d="${d}"/>`;
      gridWrap.appendChild(svg);
    }

    card.appendChild(gridWrap);

    if (data.longest) {
      const wordEl = document.createElement('div');
      wordEl.className = 'word-display';
      wordEl.textContent = data.longest;
      card.appendChild(wordEl);
    }

    const table = document.createElement('table');
    table.className = 'len-table';
    const lens = Object.keys(data.counts).map(Number).sort((a,b)=>a-b);
    const theadRow = document.createElement('tr');
    theadRow.innerHTML = '<th>Longueur</th>' + lens.map(l=>`<th>${l}</th>`).join('') + '<th>Total</th>';
    const bodyRow = document.createElement('tr');
    bodyRow.innerHTML = '<td>Mots</td>' + lens.map(l => {
      const cls = l === data.maxLen ? ' class="len-longest"' : '';
      return `<td${cls}>${data.counts[l]}</td>`;
    }).join('') + `<td class="total-cell">${data.total}</td>`;
    table.appendChild(theadRow);
    table.appendChild(bodyRow);
    card.appendChild(table);

    feedEl.appendChild(card);
  }

  worker.postMessage({ type: 'build', words: [...dictionary], words16 });
}

loadDictionary();
</script>
</body>
</html>
