<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c8a96e">
<title>Mots-Lierre — Grilles par longueur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24;
    --border:#2a2a35; --gold:#c8a96e; --gold-light:#e8c98e;
    --cream:#f0e8d8; --text:#d8d0c8; --text-dim:#8a8578;
    --tile-bg:#1a1a22; --tile-border:#30304a; --recon:#7a9ec4; --digits:#8ec49a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  header {
    max-width: 720px; margin: 0 auto 24px; text-align: center;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  #controls label {
    font-size: 0.68rem; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase;
  }
  #reconStatus {
    font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 12px;
  }
  #reconStatus strong { color: var(--recon); }
  select {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 12px; border-radius: 10px;
    border: 1.5px solid var(--recon); background: var(--surface); color: var(--recon);
  }
  select:disabled { opacity: 0.4; }
  button {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--gold); background: transparent; color: var(--gold);
    transition: all .15s;
  }
  button.recon-btn { border-color: var(--recon); color: var(--recon); }
  button.recon-btn:hover { background: rgba(122,158,196,0.1); }
  button.digits-btn { border-color: var(--digits); color: var(--digits); }
  button.digits-btn:hover { background: rgba(142,196,154,0.1); }
  button:hover { background: rgba(200,169,110,0.1); }
  button:disabled { opacity: 0.4; cursor: default; }

  #feed {
    max-width: 720px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    animation: fadeIn .4s ease-out;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

  .card-head {
    text-align: center;
  }
  .card-badge {
    display: inline-block; font-size: 0.6rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: #0d0d0f; background: var(--gold);
    border-radius: 6px; padding: 3px 10px; font-weight: 500; margin-bottom: 6px;
  }
  .card.recon .card-badge { background: var(--recon); }
  .card.recon .path-svg path { stroke: var(--recon); filter: drop-shadow(0 0 4px rgba(122,158,196,.6)); }
  .card.recon .tile.in-path { border-color: var(--recon); color: #cfe0f0; }
  .card.recon .tile .order-badge { color: var(--recon); }
  .card.recon .word-display { color: #cfe0f0; }
  .card.digits .card-badge { background: var(--digits); }
  .card.digits .path-svg path { stroke: var(--digits); filter: drop-shadow(0 0 4px rgba(142,196,154,.6)); }
  .card.digits .tile.in-path { border-color: var(--digits); color: #d9f0dd; }
  .card.digits .tile .order-badge { color: var(--digits); }
  .card.digits .word-display { color: #d9f0dd; }
  .card-sub {
    font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  .grid-wrap { position: relative; width: 278px; height: 278px; }
  .grid {
    display: grid; grid-template-columns: repeat(4, 62px); grid-template-rows: repeat(4, 62px);
    gap: 6px;
  }
  .path-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .path-svg path {
    fill: none; stroke: var(--gold); stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round; opacity: .75;
    filter: drop-shadow(0 0 4px rgba(200,169,110,.6));
  }
  .tile {
    width: 62px; height: 62px;
    background: var(--tile-bg); border: 1.5px solid var(--tile-border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700;
    color: var(--cream);
    position: relative;
  }
  .tile.in-path {
    background: #201c30; border-color: var(--gold); color: var(--gold-light);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .tile .order-badge {
    position: absolute; top: 2px; left: 3px;
    font-family: 'DM Mono', monospace; font-size: 0.55rem; font-weight: 500;
    color: var(--gold);
  }
  .word-display {
    font-family: 'Playfair Display', serif; font-size: 1rem;
    color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase;
  }

  .grid-wrap.clickable { cursor: pointer; }
  .word-list {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: 380px; padding-top: 4px;
  }
  .word-chip {
    font-family: 'DM Mono', monospace; font-size: 0.66rem; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-dim);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; transition: all .15s;
  }
  .word-chip:hover { border-color: var(--recon); color: #cfe0f0; }
  .word-chip.selected {
    background: rgba(122,158,196,0.18); border-color: var(--recon); color: #cfe0f0;
    font-weight: 500;
  }
  .digit-list {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: 380px;
  }
  .digit-chip {
    font-family: 'DM Mono', monospace; font-size: 0.66rem; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--digits);
    background: rgba(142,196,154,0.1); border: 1px solid var(--digits);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; transition: all .15s;
  }
  .digit-chip:hover { background: rgba(142,196,154,0.22); }
  .digit-chip.selected {
    background: rgba(142,196,154,0.3); font-weight: 500;
  }

  table.len-table {
    border-collapse: collapse; font-size: 0.72rem; width: 100%; max-width: 380px;
  }
  table.len-table th, table.len-table td {
    border: 1px solid var(--border); padding: 6px 4px; text-align: center;
  }
  table.len-table th {
    color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.6rem;
    background: var(--surface2);
  }
  table.len-table td.len-longest { color: var(--gold-light); font-weight: 500; }
  table.len-table td.total-cell { color: var(--gold); font-weight: 500; }

  #loadingScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px; z-index: 100;
  }
  #loadingScreen h2 {
    font-family: 'Playfair Display', serif; font-size: 1.8rem;
    color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase;
  }
  #loadingMsg { font-size: 0.68rem; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
  .bar-wrap { width: min(80vw, 300px); height: 4px; background: var(--surface2); border-radius: 2px; overflow:hidden; }
  #progressBar { height: 100%; width: 0%; background: var(--gold); transition: width .2s; }
  #errorMsg { font-size: 0.7rem; color: #e05252; text-align: center; max-width: 320px; display:none; }
</style>
</head>
<body>

<div id="loadingScreen">
  <h2>Mots-Lierre</h2>
  <div id="loadingMsg">Chargement du dictionnaire…</div>
  <div class="bar-wrap"><div id="progressBar"></div></div>
  <div id="errorMsg"></div>
</div>

<header>
  <h1>Grilles par longueur de mot</h1>
  <div id="controls">
    <label for="lenSelect">Longueur du mot le plus long :</label>
    <select id="lenSelect" disabled></select>
    <button id="btnReconstruct" class="recon-btn" disabled>Lancer</button>
  </div>
  <div id="reconStatus">Préparation…</div>

  <div id="digitsControls" style="margin-top:18px;">
    <button id="btnDigits" class="digits-btn" disabled>Maximiser les chiffres (0 à 9)</button>
  </div>
  <div id="digitsStatus"></div>
</header>

<div id="feed"></div>

<script>
// ══════════════════════════════════════════════════════════
// DICTIONNAIRE
// ══════════════════════════════════════════════════════════
const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();

function setMsg(t){ document.getElementById('loadingMsg').textContent = t; }
function setBar(p){ document.getElementById('progressBar').style.width = p+'%'; }
function showError(msg){
  const e = document.getElementById('errorMsg');
  e.textContent = msg; e.style.display = 'block';
  setMsg('Erreur de chargement');
}

async function loadDictionary() {
  setMsg('Chargement du dictionnaire…'); setBar(5);
  let text;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    const resp = await fetch('ODS.txt', { signal: controller.signal });
    clearTimeout(timeout);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ODS.txt introuvable. Placez ce fichier à côté de cette page.`);
    setBar(30);
    text = await resp.text();
    setBar(60);
  } catch(e) {
    if (e.name === 'AbortError') showError('Délai dépassé — ODS.txt trop long à charger.');
    else showError(e.message);
    return;
  }

  setMsg('Analyse des mots…'); setBar(62);
  const dictionary = new Set();
  const lines = text.replace(/\r/g,'').split('\n');
  let n=0;
  for (let i=0; i<lines.length; i++) {
    const w = lines[i].trim(); if (!w) continue;
    if (w.length>=3 && w.length<=16) dictionary.add(normalize(w));
    n++;
    if (n%50000===0) { setBar(62+Math.min(33,(n/lines.length*33)|0)); await new Promise(r=>setTimeout(r,0)); }
  }
  setBar(100);
  setMsg(`${dictionary.size.toLocaleString('fr-FR')} mots chargés ✓`);

  const wordsByLen = {};
  for (const w of dictionary) {
    (wordsByLen[w.length] = wordsByLen[w.length] || []).push(w);
  }

  await new Promise(r=>setTimeout(r,500));
  document.getElementById('loadingScreen').style.display = 'none';
  startEngine(dictionary, wordsByLen);
}

function findPathClient(board, word) {
  const N = 4;
  const adj = [];
  for (let i = 0; i < 16; i++) {
    adj[i] = [];
    const r = Math.floor(i / N), c = i % N;
    for (let j = 0; j < 16; j++) {
      const dr = Math.abs(r - Math.floor(j/N)), dc = Math.abs(c - j%N);
      if (dr<=1 && dc<=1 && i!==j) adj[i].push(j);
    }
  }
  function dfs(idx, path, wi) {
    if (wi === word.length) return true;
    for (const nb of adj[idx]) {
      if (path.includes(nb)) continue;
      if (board[nb] !== word[wi]) continue;
      path.push(nb);
      if (dfs(nb, path, wi+1)) return true;
      path.pop();
    }
    return false;
  }
  for (let i = 0; i < 16; i++) {
    if (board[i] !== word[0]) continue;
    const path = [i];
    if (dfs(i, path, 1)) return path;
  }
  return null;
}

// ══════════════════════════════════════════════════════════
// WORKER — trie + génération/analyse de grilles en tâche de fond
// ══════════════════════════════════════════════════════════
function startEngine(dictionary, wordsByLen) {
  const workerCode = `
    function buildTrie(words) {
      const root = Object.create(null);
      for (const w of words) {
        let node = root;
        for (const ch of w) {
          if (!node[ch]) node[ch] = Object.create(null);
          node = node[ch];
        }
        node['$'] = true;
      }
      return root;
    }

    function buildAdjacency() {
      const N = 4;
      const adj = [];
      for (let i = 0; i < 16; i++) {
        adj[i] = [];
        const r = Math.floor(i / N), c = i % N;
        for (let j = 0; j < 16; j++) {
          const dr = Math.abs(r - Math.floor(j/N)), dc = Math.abs(c - j%N);
          if (dr<=1 && dc<=1 && i!==j) adj[i].push(j);
        }
      }
      return adj;
    }
    const ADJ = buildAdjacency();

    // Analyse la grille et s'arrête dès qu'un (cap+1)-ième mot est trouvé :
    // inutile de compter tous les mots d'une grille qu'on va de toute façon écarter.
    function analyzeBoardCapped(board, trie, cap) {
      const found = new Set();
      let overflow = false;
      function dfs(idx, path, node, word) {
        if (overflow) return;
        if (word.length >= 3 && node['$']) {
          found.add(word);
          if (found.size > cap) { overflow = true; return; }
        }
        for (const nb of ADJ[idx]) {
          if (overflow) return;
          if (path.includes(nb)) continue;
          const ch = board[nb];
          if (!node[ch]) continue;
          path.push(nb);
          dfs(nb, path, node[ch], word + ch);
          path.pop();
        }
      }
      for (let i = 0; i < 16; i++) {
        if (overflow) break;
        const ch = board[i];
        if (!trie[ch]) continue;
        dfs(i, [i], trie[ch], ch);
      }
      return { words: [...found], overflow };
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.random()*(i+1)|0;
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    // Cherche un chemin (suite d'indices de cases adjacentes, sans répétition) de longueur L,
    // via un parcours en profondeur avec ordre de voisins aléatoire et retour arrière.
    function randomPathOfLength(L) {
      for (let attempt = 0; attempt < 300; attempt++) {
        const visited = new Array(16).fill(false);
        const path = [];
        const start = Math.random()*16|0;
        path.push(start); visited[start] = true;
        let steps = 0;
        const STEP_CAP = 20000;
        let stepLimitHit = false;
        function dfs(node) {
          if (path.length === L) return true;
          const neighbors = shuffle(ADJ[node].slice());
          for (const nb of neighbors) {
            if (visited[nb]) continue;
            steps++;
            if (steps > STEP_CAP) { stepLimitHit = true; return false; }
            visited[nb] = true; path.push(nb);
            if (dfs(nb)) return true;
            path.pop(); visited[nb] = false;
            if (stepLimitHit) return false;
          }
          return false;
        }
        if (dfs(start)) return path;
      }
      return null;
    }

    const FRENCH_DICE_W = [
      'AELMNU','AEHLOS','AINOTW','ABORTU','EILTUZ','AEIPSV','AEINRT',
      'EIORTY','ADEILS','ACEINO','ACELRS','EJLRST','EIPRSU','AEKOQS',
      'ACFNTX','CEGILR'
    ];
    function randomBoard() {
      const dice=[...FRENCH_DICE_W];
      for (let i=dice.length-1;i>0;i--) { const j=Math.random()*(i+1)|0; [dice[i],dice[j]]=[dice[j],dice[i]]; }
      return dice.map(d=>d[Math.random()*d.length|0]);
    }

    let trie = null;
    let wordsByLen = {};

    function lengthCounts(words) {
      const counts = {};
      let maxLen = 0;
      for (const w of words) {
        counts[w.length] = (counts[w.length]||0) + 1;
        if (w.length > maxLen) maxLen = w.length;
      }
      return { counts, maxLen };
    }

    // ── Mode "Maximiser les chiffres" ──────────────────────────
    const DIGIT_WORDS = ['ZERO','UN','DEUX','TROIS','QUATRE','CINQ','SIX','SEPT','HUIT','NEUF'];

    // Cherche si "word" existe comme chemin de cases adjacentes sur le plateau
    // (indépendant du trie : autorise aussi "UN", qui ne compte pas comme mot de 3+ lettres).
    function pathExists(board, word) {
      function dfs(idx, path, wi) {
        if (wi === word.length) return path.slice();
        for (const nb of ADJ[idx]) {
          if (path.includes(nb)) continue;
          if (board[nb] !== word[wi]) continue;
          path.push(nb);
          const r = dfs(nb, path, wi+1);
          if (r) return r;
          path.pop();
        }
        return null;
      }
      for (let i = 0; i < 16; i++) {
        if (board[i] !== word[0]) continue;
        const p = dfs(i, [i], 1);
        if (p) return p;
      }
      return null;
    }

    // Place un mot sur le plateau en réutilisant les cases déjà assignées si les lettres
    // correspondent, sinon en assignant de nouvelles cases. Abandonne si le budget de pas
    // est épuisé. Ne fait PAS marche arrière sur les mots déjà placés (placement glouton).
    function extendDigitPath(board, assigned, path, word, wi, budget, newly) {
      if (wi === word.length) return true;
      const last = path[path.length-1];
      const neighbors = shuffle(ADJ[last].slice());
      for (const nb of neighbors) {
        if (path.includes(nb)) continue;
        budget.steps--;
        if (budget.steps <= 0) return false;
        const ch = word[wi];
        if (assigned[nb]) {
          if (board[nb] !== ch) continue;
          path.push(nb);
          if (extendDigitPath(board, assigned, path, word, wi+1, budget, newly)) return true;
          path.pop();
        } else {
          board[nb] = ch; assigned[nb] = true; newly.push(nb);
          path.push(nb);
          if (extendDigitPath(board, assigned, path, word, wi+1, budget, newly)) return true;
          path.pop();
          newly.pop();
          assigned[nb] = false; board[nb] = null;
        }
      }
      return false;
    }

    function tryPlaceDigitWord(board, assigned, word, budget) {
      const starts = shuffle([...Array(16).keys()]);
      for (const start of starts) {
        if (budget.steps <= 0) return false;
        const ch0 = word[0];
        const wasAssigned = assigned[start];
        if (wasAssigned && board[start] !== ch0) continue;
        const newly = [];
        if (!wasAssigned) { board[start] = ch0; assigned[start] = true; newly.push(start); }
        const path = [start];
        budget.steps--;
        if (extendDigitPath(board, assigned, path, word, 1, budget, newly)) return true;
        for (const cell of newly) { assigned[cell] = false; board[cell] = null; }
      }
      return false;
    }

    // Construit une grille candidate en essayant de placer, dans un ordre aléatoire,
    // le plus de mots-chiffres possible (placement glouton), puis remplit le reste au hasard.
    function buildDigitsCandidate() {
      const board = new Array(16).fill(null);
      const assigned = new Array(16).fill(false);
      const order = shuffle(DIGIT_WORDS.slice());
      const budget = { steps: 1500 };
      for (const word of order) {
        if (budget.steps <= 0) break;
        tryPlaceDigitWord(board, assigned, word, budget);
      }
      const filler = randomBoard();
      for (let i = 0; i < 16; i++) if (!assigned[i]) board[i] = filler[i];
      return board;
    }

    let digitsRunning = false;
    let digitsTested = 0;
    let digitsBest = -1;
    const DIGITS_MAX_WORDS = 19;

    function digitsLoop() {
      if (!digitsRunning) return;
      const BATCH = 15;
      for (let k = 0; k < BATCH; k++) {
        const board = buildDigitsCandidate();
        digitsTested++;
        const { words, overflow } = analyzeBoardCapped(board, trie, DIGITS_MAX_WORDS);
        if (overflow) continue; // 20e mot trouvé : on abandonne cette grille
        const digits = [];
        for (const w of DIGIT_WORDS) {
          const p = pathExists(board, w);
          if (p) digits.push({ word: w, path: p });
        }
        if (digits.length > digitsBest) {
          digitsBest = digits.length;
          const { counts, maxLen } = lengthCounts(words);
          self.postMessage({ type:'digitsGrid', board, counts, total: words.length, maxLen, words, digits, digitCount: digits.length });
        }
      }
      self.postMessage({ type:'digitsProgress', tested: digitsTested, best: digitsBest });
      setTimeout(digitsLoop, 0);
    }

    let reconRunning = false;
    let reconTested = 0;
    let reconFound = 0;
    let reconTargetLen = null;
    const MAX_WORDS = 21;

    function reconLoop() {
      if (!reconRunning) return;
      const list = wordsByLen[reconTargetLen];
      if (!list || !list.length) {
        self.postMessage({ type:'reconError', message:'Aucun mot de ' + reconTargetLen + ' lettres dans le dictionnaire.' });
        reconRunning = false;
        return;
      }
      const BATCH = 40;
      for (let k = 0; k < BATCH; k++) {
        const word = list[Math.random()*list.length|0];
        const path = randomPathOfLength(word.length);
        if (!path) continue;
        const board = randomBoard();
        for (let i = 0; i < path.length; i++) board[path[i]] = word[i];
        const { words, overflow } = analyzeBoardCapped(board, trie, MAX_WORDS);
        reconTested++;
        if (overflow) continue; // 22e mot trouvé : on abandonne cette grille sans aller plus loin
        const { counts, maxLen } = lengthCounts(words);
        if (maxLen > reconTargetLen) continue; // un mot plus long que voulu existe : on rejette cette grille
        reconFound++;
        self.postMessage({ type:'reconGrid', board, counts, total: words.length, maxLen, longest: word, path, words, targetLen: reconTargetLen });
      }
      self.postMessage({ type:'reconProgress', tested: reconTested });
      setTimeout(reconLoop, 0);
    }

    self.onmessage = function(e) {
      if (e.data.type === 'build') {
        trie = buildTrie(e.data.words);
        wordsByLen = e.data.wordsByLen || {};
        self.postMessage({ type:'ready' });
      } else if (e.data.type === 'reconstruct') {
        reconTargetLen = e.data.targetLen;
        reconFound = 0;
        reconTested = 0;
        reconRunning = true;
        reconLoop();
      } else if (e.data.type === 'reconPause') {
        reconRunning = false;
      } else if (e.data.type === 'reconResume') {
        reconRunning = true;
        reconLoop();
      } else if (e.data.type === 'digits') {
        digitsBest = -1;
        digitsTested = 0;
        digitsRunning = true;
        digitsLoop();
      } else if (e.data.type === 'digitsPause') {
        digitsRunning = false;
      } else if (e.data.type === 'digitsResume') {
        digitsRunning = true;
        digitsLoop();
      }
    };
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([workerCode], {type:'application/javascript'})));

  const feedEl = document.getElementById('feed');
  const btnReconstruct = document.getElementById('btnReconstruct');
  const reconStatusEl = document.getElementById('reconStatus');
  const lenSelect = document.getElementById('lenSelect');
  const btnDigits = document.getElementById('btnDigits');
  const digitsStatusEl = document.getElementById('digitsStatus');

  const availableLens = Object.keys(wordsByLen).map(Number).filter(l => wordsByLen[l].length > 0).sort((a,b)=>a-b);
  availableLens.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = `${l} lettres (${wordsByLen[l].length.toLocaleString('fr-FR')} mots)`;
    lenSelect.appendChild(opt);
  });
  if (availableLens.length) lenSelect.value = availableLens[Math.floor(availableLens.length/2)];

  let reconCount = 0;
  let reconTested = 0;
  let reconActive = false;
  let reconRunning = false;

  let digitsActive = false;
  let digitsRunning = false;
  let digitsTested = 0;
  let digitsBest = -1;

  worker.onmessage = (e) => {
    if (e.data.type === 'ready') {
      reconStatusEl.textContent = 'Prêt — choisissez une longueur et lancez la recherche.';
      lenSelect.disabled = false;
      btnReconstruct.disabled = false;
      btnDigits.disabled = false;
      digitsStatusEl.textContent = 'Prêt à chercher.';
    } else if (e.data.type === 'reconGrid') {
      reconCount++;
      addCard(e.data, 'recon');
      updateReconStatus();
    } else if (e.data.type === 'reconProgress') {
      reconTested = e.data.tested;
      updateReconStatus();
    } else if (e.data.type === 'reconError') {
      reconStatusEl.textContent = e.data.message;
    } else if (e.data.type === 'digitsGrid') {
      digitsBest = e.data.digitCount;
      addCard(e.data, 'digits');
      updateDigitsStatus();
    } else if (e.data.type === 'digitsProgress') {
      digitsTested = e.data.tested;
      updateDigitsStatus();
    }
  };

  function updateReconStatus() {
    const txt = `<strong>${reconCount}</strong> grille${reconCount>1?'s':''} affichée${reconCount>1?'s':''} (≤ 21 mots) · ${reconTested.toLocaleString('fr-FR')} testée${reconTested>1?'s':''}`;
    reconStatusEl.innerHTML = txt;
  }

  function updateDigitsStatus() {
    let txt = `${digitsTested.toLocaleString('fr-FR')} grille${digitsTested>1?'s':''} testée${digitsTested>1?'s':''}`;
    if (digitsBest >= 0) txt += ` · meilleur score : <strong>${digitsBest}</strong> / 10 chiffres`;
    digitsStatusEl.innerHTML = txt;
  }

  function resetSearch() {
    reconActive = false;
    reconRunning = false;
    reconCount = 0;
    reconTested = 0;
    btnReconstruct.textContent = 'Lancer';
    reconStatusEl.textContent = 'Prêt — choisissez une longueur et lancez la recherche.';
  }

  function resetDigitsSearch() {
    digitsActive = false;
    digitsRunning = false;
    digitsTested = 0;
    digitsBest = -1;
    btnDigits.textContent = 'Maximiser les chiffres (0 à 9)';
    digitsStatusEl.textContent = 'Prêt à chercher.';
  }

  btnDigits.addEventListener('click', () => {
    if (!digitsActive) {
      digitsActive = true;
      digitsRunning = true;
      digitsTested = 0;
      digitsBest = -1;
      worker.postMessage({ type: 'digits' });
      btnDigits.textContent = 'Pause';
    } else {
      digitsRunning = !digitsRunning;
      worker.postMessage({ type: digitsRunning ? 'digitsResume' : 'digitsPause' });
      btnDigits.textContent = digitsRunning ? 'Pause' : 'Reprendre';
    }
  });

  lenSelect.addEventListener('change', () => {
    if (reconActive) {
      if (reconRunning) worker.postMessage({ type: 'reconPause' });
      resetSearch();
    }
  });

  btnReconstruct.addEventListener('click', () => {
    if (!reconActive) {
      const targetLen = Number(lenSelect.value);
      reconActive = true;
      reconRunning = true;
      reconCount = 0;
      reconTested = 0;
      lenSelect.disabled = true;
      worker.postMessage({ type: 'reconstruct', targetLen });
      btnReconstruct.textContent = 'Pause';
    } else {
      reconRunning = !reconRunning;
      lenSelect.disabled = reconRunning;
      worker.postMessage({ type: reconRunning ? 'reconResume' : 'reconPause' });
      btnReconstruct.textContent = reconRunning ? 'Pause' : 'Reprendre';
    }
  });

  function addCard(data, kind) {
    const card = document.createElement('div');
    card.className = 'card' + (kind === 'recon' ? ' recon' : '') + (kind === 'digits' ? ' digits' : '');

    const head = document.createElement('div');
    head.className = 'card-head';
    const badge = document.createElement('div');
    badge.className = 'card-badge';
    if (kind === 'digits') badge.textContent = `${data.digitCount} chiffre${data.digitCount>1?'s':''} sur 10`;
    else badge.textContent = `Rétroconstruction — mot de ${data.targetLen} lettres`;
    head.appendChild(badge);
    const sub = document.createElement('div');
    sub.className = 'card-sub';
    if (kind === 'digits') {
      const found = data.digits.map(d => d.word).join(', ');
      sub.textContent = `${data.total} mots trouvables (< 20) · chiffres : ${found}`;
    } else {
      sub.textContent = `${data.total} mots trouvables · plus long mot : ${data.maxLen} lettres`;
    }
    head.appendChild(sub);
    card.appendChild(head);

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    const grid = document.createElement('div');
    grid.className = 'grid';
    const tiles = [];
    data.board.forEach((letter, i) => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.textContent = letter;
      const badgeEl = document.createElement('span');
      badgeEl.className = 'order-badge';
      badgeEl.style.display = 'none';
      t.appendChild(badgeEl);
      tiles.push(t);
      grid.appendChild(t);
    });
    gridWrap.appendChild(grid);

    const TILE = 62, GAP = 6;
    const centerOf = idx => {
      const r = Math.floor(idx / 4), c = idx % 4;
      return { x: c*(TILE+GAP) + TILE/2, y: r*(TILE+GAP) + TILE/2 };
    };
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'path-svg');
    svg.setAttribute('viewBox', `0 0 278 278`);
    const svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    svg.appendChild(svgPath);
    gridWrap.appendChild(svg);

    const wordEl = document.createElement('div');
    wordEl.className = 'word-display';

    function renderPath(path, word) {
      tiles.forEach(t => {
        t.classList.remove('in-path');
        t.querySelector('.order-badge').style.display = 'none';
      });
      if (path && path.length) {
        path.forEach((idx, i) => {
          tiles[idx].classList.add('in-path');
          const b = tiles[idx].querySelector('.order-badge');
          b.textContent = i + 1;
          b.style.display = '';
        });
      }
      if (path && path.length >= 2) {
        const d = path.map((idx, k) => {
          const p = centerOf(idx);
          return `${k ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;
        }).join(' ');
        svgPath.setAttribute('d', d);
        svg.style.display = '';
      } else {
        svgPath.setAttribute('d', '');
      }
      wordEl.textContent = word || '';
      wordEl.style.display = word ? '' : 'none';
    }

    const defaultPath = kind === 'digits' ? null : data.path;
    const defaultWord = kind === 'digits' ? null : data.longest;
    renderPath(defaultPath, defaultWord);

    card.appendChild(gridWrap);
    card.appendChild(wordEl);

    let digitChipsEl = null;
    if (kind === 'digits' && data.digits && data.digits.length) {
      digitChipsEl = document.createElement('div');
      digitChipsEl.className = 'digit-list';
      data.digits.forEach(d => {
        const chip = document.createElement('span');
        chip.className = 'digit-chip';
        chip.textContent = d.word;
        chip.addEventListener('click', () => {
          [...digitChipsEl.querySelectorAll('.digit-chip.selected')].forEach(c => c.classList.remove('selected'));
          if (wordsListEl) wordsListEl.querySelectorAll('.word-chip.selected').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          renderPath(d.path, d.word);
        });
        digitChipsEl.appendChild(chip);
      });
      card.appendChild(digitChipsEl);
    }

    let wordsListEl = null;
    if ((kind === 'recon' || kind === 'digits') && data.words && data.words.length) {
      gridWrap.classList.add('clickable');
      wordsListEl = document.createElement('div');
      wordsListEl.className = 'word-list';
      wordsListEl.style.display = 'none';
      const sortedWords = data.words.slice().sort((a,b) => b.length - a.length || a.localeCompare(b));
      sortedWords.forEach(w => {
        const chip = document.createElement('span');
        chip.className = 'word-chip';
        chip.textContent = w;
        chip.addEventListener('click', () => {
          const p = findPathClient(data.board, w);
          if (!p) return;
          wordsListEl.querySelectorAll('.word-chip.selected').forEach(c => c.classList.remove('selected'));
          if (digitChipsEl) digitChipsEl.querySelectorAll('.digit-chip.selected').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          renderPath(p, w);
        });
        wordsListEl.appendChild(chip);
      });
      card.appendChild(wordsListEl);

      gridWrap.addEventListener('click', () => {
        const showing = wordsListEl.style.display !== 'none';
        if (showing) {
          wordsListEl.style.display = 'none';
          wordsListEl.querySelectorAll('.word-chip.selected').forEach(c => c.classList.remove('selected'));
          if (digitChipsEl) digitChipsEl.querySelectorAll('.digit-chip.selected').forEach(c => c.classList.remove('selected'));
          renderPath(defaultPath, defaultWord);
        } else {
          wordsListEl.style.display = 'flex';
        }
      });
    }

    const table = document.createElement('table');
    table.className = 'len-table';
    const lens = Object.keys(data.counts).map(Number).sort((a,b)=>a-b);
    const theadRow = document.createElement('tr');
    theadRow.innerHTML = '<th>Longueur</th>' + lens.map(l=>`<th>${l}</th>`).join('') + '<th>Total</th>';
    const bodyRow = document.createElement('tr');
    bodyRow.innerHTML = '<td>Mots</td>' + lens.map(l => {
      const cls = l === data.maxLen ? ' class="len-longest"' : '';
      return `<td${cls}>${data.counts[l]}</td>`;
    }).join('') + `<td class="total-cell">${data.total}</td>`;
    table.appendChild(theadRow);
    table.appendChild(bodyRow);
    card.appendChild(table);

    feedEl.appendChild(card);
  }

  worker.postMessage({ type: 'build', words: [...dictionary], wordsByLen });
}

loadDictionary();
</script>
</body>
</html>
